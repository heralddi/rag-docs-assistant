[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ragdocs"
version = "0.1.0"
description = "Question answering over API documentation with cited sources"
authors = [{ name = "Herald Bao Di" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scikit-learn",
    "sentence-transformers",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

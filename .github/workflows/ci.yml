name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The tests only exercise the tfidf backend, so sentence-transformers
      # (and the torch download it drags in) stays out of CI.
      - run: pip install numpy scikit-learn pytest ruff
      - run: pip install -e . --no-deps
      - run: ruff check .
      - run: python -m pytest
